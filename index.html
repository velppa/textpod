<!DOCTYPE html>
<html>

<head>
    <title>Textpod</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="shortcut icon" href="{{FAVICON}}" />
    <style>
        {{TUFTE_CSS}}
        {{SHARED_CSS}}

        html {
            height: 100%;
        }

        #editor {
            width: 55%;
            height: 200px;
            font-family: monospace;
            font-size: inherit;
            padding: 1em;
            resize: vertical;
            box-sizing: border-box
        }

        #submitContainer {
            width: 55%;
            margin-bottom: 1.5em;
            text-align: right;
        }

        #submitButton {
            font-family: monospace;
            padding: 0.4em 1em;
            background-color: var(--color-secondary);
            color: var(--color-text-secondary);
            border: none;
            cursor: pointer;
        }

        section.note p.subtitle {
            font-size: 1.1rem;
            font-style: normal;
            font-family: "Gill Sans", "Gill Sans MT", Calibri, sans-serif;
            color: var(--color-secondary);
            margin-top: -0.5rem;
            margin-bottom: 1.5rem;
        }

        section.note p.subtitle a {
            color: inherit;
            text-decoration: none;
        }

        section.note p.subtitle a:hover {
            text-decoration: underline;
        }

        section.note p.subtitle a::after {
            content: none !important;
        }

        footer {
            margin-top: 3em;
            padding-top: 1em;
            border-top: 1px solid var(--color-secondary);
            font-size: 0.8em;
            color: var(--color-secondary);
            text-align: center;
        }
    </style>
</head>

<body>

    <textarea id="editor"
        placeholder="Ctrl+Enter to save.&#10;Type / to search.&#10;Drag & drop files to attach.&#10;Start links with + to save local copies."></textarea>
    <div id="submitContainer"><button id="submitButton">Submit</button></div>

    <script>
        const BASE_PATH = '{{BASE_PATH}}';
        const READONLY = {{READONLY}};
        if (READONLY) {
            const ed = document.getElementById('editor');
            ed.placeholder = 'Type to search.';
            ed.style.height = '2.5em';
            ed.style.paddingTop = '0.4em';
            ed.style.paddingBottom = '0.4em';
            ed.style.resize = 'none';
            document.getElementById('submitContainer').style.display = 'none';
        }
    </script>
    <nav id="toc"></nav>
    <div id="notes"></div>

    <script>
        const editor = document.getElementById('editor');
        const notesDiv = document.getElementById('notes');
        const submitButton = document.getElementById('submitButton');
        let searchTimeout = null;

        window.addEventListener('load', async () => {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (q) {
                editor.value = READONLY ? q : '/' + q;
            }
            displayNotes();
        });

        // Insert a tufte-style subtitle paragraph immediately after the
        // first heading in the note's HTML.  When there is no heading,
        // prepend the subtitle so the metadata is still visible.
        function injectSubtitle(html, inner) {
            let out = html;
            let tagsInner = '';
            const headingRe = /<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/i;
            const headMatch = out.match(headingRe);
            if (headMatch) {
                const headInner = headMatch[1];
                const tagsRe = /\s*<span class="tags">([\s\S]*?)<\/span>\s*/i;
                const tagsMatch = headInner.match(tagsRe);
                if (tagsMatch) {
                    const anchorRe = /<a class="tag" href="([^"]*)">([^<]+)<\/a>/gi;
                    const links = [...tagsMatch[1].matchAll(anchorRe)]
                        .map((m, i) => {
                            const text = i === 0 ? `:${m[2]}:` : `${m[2]}:`;
                            return `<a class="tag" href="${m[1]}">${text}</a>`;
                        });
                    if (links.length) {
                        tagsInner = `<span class="tags">${links.join('')}</span>`;
                    }
                    const cleaned = headInner.slice(0, tagsMatch.index)
                        + headInner.slice(tagsMatch.index + tagsMatch[0].length);
                    const headStart = headMatch.index;
                    const innerStart = headStart + headMatch[0].indexOf(headInner);
                    out = out.slice(0, innerStart) + cleaned
                        + out.slice(innerStart + headInner.length);
                }
            }
            const combined = tagsInner ? `${inner} &middot; ${tagsInner}` : inner;
            const subtitle = `<p class="subtitle">${combined}</p>`;
            const closeRe = /<\/h[1-6]>/i;
            const m = out.match(closeRe);
            if (m) {
                const idx = m.index + m[0].length;
                return out.slice(0, idx) + subtitle + out.slice(idx);
            }
            return subtitle + out;
        }

        const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        function formatTimestamp(ts) {
            const d = new Date(ts.replace(' ', 'T'));
            const day = DAYS[d.getDay()];
            return ts.replace(' ', ' ' + day + ' ');
        }

        // fetches and displays all notes, optionally filtering them based on the query parameter `q`
        async function displayNotes() {
            const params = new URLSearchParams(window.location.search);
            const searchQuery = params.get('q');
            let response = await fetch(BASE_PATH + '/notes');
            if (response.ok) {
                const notes = await response.json();
                notesDiv.innerHTML = notes
                    .filter(note => !searchQuery || note.content.toLowerCase().includes(searchQuery.toLowerCase()) || note.timestamp.includes(searchQuery))
                    .map((note, i) => `
                    <section class="note">${injectSubtitle(note.html, `<a href="${BASE_PATH}/note/${note.id}"><time datetime="${note.timestamp}">${formatTimestamp(note.timestamp)}</time></a>`)}</section>`)
                    .join('');
            }
            buildTOC();
        }

        function buildTOC() {
            const toc = document.getElementById('toc');
            toc.innerHTML = '';
            const headings = document.querySelectorAll('#notes .note h1, #notes .note h2');
            if (headings.length < 2) return;
            const ul = document.createElement('ul');
            headings.forEach((h, i) => {
                const id = 'heading-' + i;
                h.id = id;
                const li = document.createElement('li');
                const a = document.createElement('a');
                const text = h.querySelector('span') ? h.querySelector('span').textContent : h.textContent;
                a.textContent = text.trim();
                a.href = '#' + id;
                li.appendChild(a);
                ul.appendChild(li);
            });
            toc.appendChild(ul);
        }

        // saves a new note and refreshes the page
        async function saveNotes() {
            if (!editor.value) {
                return;
            }
            const saveResponse = await fetch(BASE_PATH + '/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(editor.value)
            });

            // TODO more efficient way to do this than reloading all notes every time
            if (saveResponse.ok) {
                editor.value = '';
                displayNotes();
            }
        }

        editor.addEventListener('input', async (e) => {
            const text = editor.value;
            const isSearch = READONLY || text.startsWith('/');
            if (isSearch) {
                if (searchTimeout) {
                    clearTimeout(searchTimeout);
                }
                searchTimeout = setTimeout(async () => {
                    const query = text.startsWith('/') ? text.slice(1) : text;
                    // Update URL with search parameter
                    const newUrl = query
                        ? `${window.location.pathname}?q=${encodeURIComponent(query)}`
                        : window.location.pathname;
                    window.history.replaceState({}, '', newUrl);

                    displayNotes();
                }, 200);
            } else if (text === '') {
                // Clear search parameter from URL
                window.history.replaceState({}, '', window.location.pathname);
                displayNotes();
            }
        });

        editor.addEventListener('keydown', async (e) => {
            if (!READONLY && e.ctrlKey && e.key === 'Enter' && !editor.value.startsWith('/')) {
                saveNotes();
            }
        });

        if (!READONLY) {
            submitButton.addEventListener('click', async (e) => {
                saveNotes();
            });
        }

        editor.addEventListener('paste', (e) => {
            console.log(e);
        });

        editor.addEventListener('dragover', (e) => {
            if (!READONLY) e.preventDefault();
        });

        editor.addEventListener('drop', async (e) => {
            if (READONLY) return;
            e.preventDefault();

            const files = e.dataTransfer.files;
            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch(BASE_PATH + '/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const path = await response.json();
                    const filename = path.split('/').pop();

                    const position = editor.selectionStart;
                    const before = editor.value.substring(0, position);
                    const after = editor.value.substring(position);

                    // Link path with spaces needs to be wrapped in < >, Commonmark spec apparently handles this
                    const needsBrackets = path.includes(' ') || filename.includes(' ');
                    const formattedPath = needsBrackets ? `<${path}>` : path;

                    if (file.type.startsWith('image/')) {
                        editor.value = `${before}![${filename}](${formattedPath})${after}`;
                    } else {
                        editor.value = `${before}[${filename}](${formattedPath})${after}`;
                    }
                }
            }
        });


    </script>
    <footer>Textpod</footer>
</body>

</html>
