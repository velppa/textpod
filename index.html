<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Hotter — Pavel Popov’s notebook</title>
    <meta name="description" content="Notes on software, Emacs, useful tools and things worth keeping. A personal notebook by Pavel Popov." />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="{{FAVICON}}" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&amp;display=swap" rel="stylesheet">
    <style>
        {{BLOG_CSS}}
        {{SHARED_CSS}}
    </style>
</head>

<body class="{{VIEW_CLASS}}" id="top">
    {{HEADER}}
    <section class="archive-head" aria-labelledby="archive-title">
        <div>
            {{INDEX_LABEL}}
            <h1 class="display-title" id="archive-title">Notes &amp;<br>other things.</h1>
        </div>
        <div class="archive-search" id="search">
            {{SEARCH_BOX}}
        </div>
    </section>
    <main id="notes">{{NOTES}}</main>
    {{PAGER}}
    <footer class="site-footer"><span>Hotter{{AUTH}}</span><a href="#top">Back to top ↑</a></footer>
</body>

</html>
